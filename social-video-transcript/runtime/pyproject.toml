[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-reader"
version = "0.1.0"
description = "Social Research Reader P0: read user-provided public pages into cited, structured research output."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45,<2"]  # Douyin dynamic-render fallback; drives the local Google Chrome

[project.scripts]
social-reader = "social_reader.cli:main"
social-reader-mcp = "social_reader.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
